<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Into the Whirlpool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&family=Caveat:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: a trip, not a website; the UI is a thin instrument panel around the madness
   IDEA: an endless whirlpool through AI history (2012 to now) and on into five years of guesses
   PICTURE: shader tunnel, ribbons and dust; floating milestones, each with a faded "memory" vision
   COLOUR and TYPE: eras tint the words (blue, mint, gold, coral, pink, then a colour per future year); Unbounded + Manrope
   LAYOUT: news ticker on top, month timeline at the bottom, a detail view (vision left, text right) on tap */
:root{color-scheme:dark;--ink:#f4f0ff;--ac:#3ee8ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#05020c;overflow:hidden;color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage canvas{display:block;width:100%;height:100%}
.ticker{position:fixed;top:0;left:0;right:0;height:calc(36px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:stretch;background:linear-gradient(rgba(5,2,12,.92),rgba(5,2,12,.7));border-bottom:1px solid rgba(255,255,255,.12);z-index:3}
.ticker .tag{flex:none;display:grid;place-items:center;padding:0 12px;font:800 12px Unbounded,system-ui,sans-serif;color:#05020c;background:#ff4a6a}
.lane{position:relative;flex:1;overflow:hidden}
.hl{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:none;color:var(--ink);font:600 14px Manrope,system-ui,sans-serif;padding:0 14px;cursor:pointer;will-change:transform}
.hl b{color:#ff9a4a;font-weight:700}.hl.pred b{color:#ffe08a}.hl.pred span{font-style:italic}
.hl:hover span,.hl:focus-visible span{text-decoration:underline}
.hl:focus-visible{outline:2px solid #ff9a4a;outline-offset:-4px}
#tl{position:fixed;left:0;right:0;bottom:0;width:100%;height:70px;z-index:3;cursor:pointer;margin-bottom:env(safe-area-inset-bottom)}
.hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);font:600 13px Manrope,system-ui,sans-serif;color:#fff;opacity:.7;white-space:nowrap;pointer-events:none;transition:opacity 2s;text-shadow:0 0 12px #000;z-index:2}
.hint.gone{opacity:0}
.panel{position:fixed;inset:0;z-index:4;display:none}
.panel.open{display:block}
.pinfo{position:absolute;left:52%;right:max(4vw,20px);top:56px;bottom:90px;overflow:auto;padding:22px 24px;border-radius:20px;background:rgba(12,6,26,.55);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);box-shadow:0 0 60px -20px var(--ac);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:rise .4s ease both}
.panel.narrow .pinfo{left:12px;right:12px;top:var(--pt,50%);bottom:calc(70px + env(safe-area-inset-bottom));padding:16px 18px;border-radius:16px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-weight:700;color:var(--ac)}
.pmeta span:last-child{color:var(--ink);opacity:.65}
.pinfo h2{font:800 clamp(22px,2.8vw,34px)/1.08 Unbounded,system-ui,sans-serif;margin:10px 0 14px;text-wrap:balance}
.pinfo h3{font:700 13px Manrope,system-ui,sans-serif;color:var(--ac);margin:18px 0 4px}
.pinfo p{margin:0;max-width:62ch;opacity:.92}
.podds[hidden],#psrcw[hidden]{display:none}
.podds{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13px}
.podds .bar{flex:1;max-width:240px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.podds .bar i{display:block;height:100%;background:var(--ac)}
.pnav{display:flex;gap:10px;margin-top:22px}
.psrc{margin:0;padding-left:18px;font-size:14px}.psrc a{color:var(--ink);opacity:.8;overflow-wrap:anywhere}.psrc a:hover{opacity:1}
.panel button{font:600 14px Manrope,system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;min-height:44px;padding:0 16px;cursor:pointer}
.panel button:hover{background:rgba(255,255,255,.16)}
.panel button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pclose{position:absolute;right:max(4vw,20px);top:50px;width:44px;padding:0!important;font-size:22px!important;z-index:1}
.panel.narrow .pclose{right:16px;top:calc(var(--pt,50%) - 56px)}
.err{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:16px system-ui;padding:24px;text-align:center}
@media(max-width:600px){.hl{font-size:13px}.pinfo h2{font-size:21px}.pinfo p{font-size:15px}.hint{font-size:12px;bottom:calc(74px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.pinfo{animation:none}}
</style>
</head>
<body>
<div id="stage" aria-label="An endless psychedelic whirlpool through AI history from 2012 to now, then five years of predictions. Tap a word to open it, hold to slow time, drag to spin."></div>
<div class="ticker" role="marquee" aria-label="News ticker"><span class="tag">NEWS</span><div class="lane" id="lane"></div></div>
<canvas id="tl" aria-label="Timeline. Tap a dot to open that moment."></canvas>
<div class="hint" id="hint">tap a word to open it · hold to slow time · drag to spin</div>
<div class="panel" id="panel" aria-hidden="true" role="dialog" aria-labelledby="ptitle">
  <div class="pinfo">
    <div class="pmeta"><span id="pkind"></span><span id="pdate"></span></div>
    <h2 id="ptitle"></h2>
    <p id="px"></p>
    <h3>What it means</h3>
    <p id="pi"></p>
    <div id="psrcw" hidden><h3>Sources</h3><ul id="psrc" class="psrc"></ul></div>
    <div class="podds" id="podds" hidden><span>My odds</span><div class="bar"><i id="poddsb"></i></div><b id="poddsv"></b></div>
    <div class="pnav"><button id="pprev">&#8592; Earlier</button><button id="pnext">Later &#8594;</button></div>
  </div>
  <button id="pclose" class="pclose" aria-label="Close">&#215;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="data.js"></script>
<script src="mem.js"></script>
<script src="main.js"></script>
<script src="audio.js"></script>
</body>
</html>
