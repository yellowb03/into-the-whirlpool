<style>
:root{color-scheme:light;--paper:#f5ecdc;--ink:#0a080f;--pink:#ff2a9d;--yellow:#ffe800;--blue:#0078bf;--red:#ff2e4c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));color:var(--ink);background:var(--paper);background-image:radial-gradient(rgb(10 8 15 / 7%) 1px,transparent 1px),linear-gradient(180deg,rgb(255 232 0 / 8%),transparent 40%,rgb(255 42 157 / 8%));background-size:10px 10px,100% 100%;font:400 15px/1.5 "IBM Plex Mono",ui-monospace,monospace}
main{position:relative;width:min(560px,100%);padding:28px 26px 26px;background:#fffaf0;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--pink)}
.tag{display:inline-block;padding:4px 10px;background:var(--yellow);border:2px solid var(--ink);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1{margin:18px 0 6px;font:900 clamp(84px,24vw,168px)/.82 "Big Shoulders Display",Impact,"Arial Narrow",sans-serif;letter-spacing:-.01em;text-shadow:5px 5px 0 var(--pink)}
h2{margin:0 0 14px;font:900 clamp(28px,7vw,40px)/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
p{margin:0 0 22px;max-width:44ch}
.stamp{position:absolute;right:18px;top:22px;padding:6px 10px;border:3px solid var(--red);color:var(--red);font-weight:600;font-size:14px;letter-spacing:.06em;transform:rotate(8deg);mix-blend-mode:multiply;opacity:.9}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;background:var(--ink);color:var(--yellow);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--pink);font:900 22px/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;transition:transform .12s,box-shadow .12s}
a.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--pink)}
a.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--pink)}
a.btn:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
@media (max-width:420px){.stamp{position:static;display:inline-block;margin-left:8px;transform:rotate(-4deg)}}
</style>
</head>
<body>
<main>
  <span class="tag">Case file not found</span><span class="stamp">MADE UP</span>

  <h2>This page is not real.</h2>
  <p>We checked the archive twice. Whatever link sent you here was invented, mistyped, or already swallowed by the whirlpool.</p>

</main>
